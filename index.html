<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Al Mastaba</title>
<style>
html,body{height:100%;margin:0}
body{display:grid;place-items:center;background:#0b1426;color:#fff;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.loading{text-align:center;padding:24px}.loading b{display:block;font-size:1.05rem;margin-bottom:6px}.loading span{opacity:.72;font-size:.82rem}
</style>
</head>
<body>
<div class="loading"><b>Opening دوري المصطبة…</b><span>Choosing the best layout for this device.</span></div>
<script>
(function(){
  var ua=navigator.userAgent||"";
  var phoneUA=/iPhone|iPod|Android.*Mobile|Windows Phone|webOS|BlackBerry|Opera Mini|IEMobile/i.test(ua);
  var narrow=window.matchMedia&&window.matchMedia("(max-width:760px)").matches;
  var coarsePhone=window.matchMedia&&window.matchMedia("(hover:none) and (pointer:coarse) and (max-width:900px)").matches;
  window.location.replace((phoneUA||narrow||coarsePhone?"mobile.html":"pc.html")+window.location.search+window.location.hash);
})();
</script>
</body>
</html>
