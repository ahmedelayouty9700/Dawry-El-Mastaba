name: Apply V11.29.1 live Cup scores
on:
  push:
    paths:
      - '.github/workflows/apply-v11291.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply live Cup overlay
        run: |
          cat > /tmp/patch.html <<'EOF'
          <!-- V11.29.1 — live provisional Cup hero scores -->
          <script id="mastaba-v11291-live-cup-score-runtime">
          (()=>{
          'use strict';
          async function refreshCupLiveHeroV11291(){
            try{
              if(!window.prodCtxV1073?.supa||!window.prodCtxV1073?.user?.id)return;
              if(!['home','rankings'].includes(state?.view))return;
              const {data,error}=await window.prodCtxV1073.supa.rpc('mastaba_public_cup_live_match');
              if(error||!data)return;
              const a=data.user1_score===null||data.user1_score===undefined?'—':String(data.user1_score);
              const b=data.user2_score===null||data.user2_score===undefined?'—':String(data.user2_score);
              document.querySelectorAll('.cup-hero-v1129 .cup-duel-score-v1129').forEach(el=>{
                const spans=el.querySelectorAll('span');
                if(spans[0])spans[0].textContent=a;
                if(spans[1])spans[1].textContent=b;
              });
            }catch(e){console.warn('Live Cup score unavailable',e)}
          }
          window.refreshCupLiveHeroV11291=refreshCupLiveHeroV11291;
          setTimeout(refreshCupLiveHeroV11291,700);
          setInterval(refreshCupLiveHeroV11291,20000);
          document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refreshCupLiveHeroV11291()});
          })();
          </script>
          EOF
          python - <<'PY'
          from pathlib import Path
          patch=Path('/tmp/patch.html').read_text()
          marker='mastaba-v11291-live-cup-score-runtime'
          for name in ('index.html','pc.html','mobile.html'):
              p=Path(name)
              if not p.exists(): continue
              text=p.read_text()
              if marker in text: continue
              pos=text.lower().rfind('</body>')
              if pos<0: raise SystemExit(f'{name}: missing body')
              p.write_text(text[:pos]+patch+'\n'+text[pos:])
          PY
      - name: Validate and commit
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,subprocess,tempfile,os
          for html in [Path(x) for x in ('index.html','pc.html','mobile.html') if Path(x).exists()]:
            for i,s in enumerate(re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',html.read_text(),re.I),1):
              with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False) as f: f.write(s); n=f.name
              r=subprocess.run(['node','--check',n],capture_output=True,text=True); os.unlink(n)
              if r.returncode: raise SystemExit(f'{html} script {i}: {r.stderr}')
          PY
          files=""
          for f in index.html pc.html mobile.html; do [ -f "$f" ] && files="$files $f"; done
          if git diff --quiet -- $files; then exit 0; fi
          git config user.name "Mastaba Production Bot"
          git config user.email "actions@users.noreply.github.com"
          git add $files
          git commit -m "V11.29.1 live provisional Cup scores"
          git push
