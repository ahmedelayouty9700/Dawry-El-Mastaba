name: Apply score stability patch

on:
  push:
    paths:
      - 'score-stability-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch and validate
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          patch=Path('score-stability-patch.html').read_text(encoding='utf-8')
          marker='mastaba-v11285-score-input-stability'
          changed=[]
          for name in ('index.html','pc.html','mobile.html'):
              p=Path(name)
              if not p.exists(): continue
              text=p.read_text(encoding='utf-8')
              if marker not in text:
                  pos=text.lower().rfind('</body>')
                  if pos<0: raise SystemExit(f'{name}: missing </body>')
                  p.write_text(text[:pos]+'\n'+patch+'\n'+text[pos:],encoding='utf-8')
                  changed.append(name)
              text=p.read_text(encoding='utf-8')
              for i,script in enumerate(re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',text,re.I),1):
                  with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8') as f:
                      f.write(script); tmp=f.name
                  r=subprocess.run(['node','--check',tmp],capture_output=True,text=True)
                  if r.returncode: raise SystemExit(f'{name} script {i}: {r.stderr}')
          print('patched',changed)
          PY
      - name: Commit
        run: |
          FILES=""
          for f in index.html pc.html mobile.html; do [ -f "$f" ] && FILES="$FILES $f"; done
          if git diff --quiet -- $FILES; then exit 0; fi
          git config user.name "Mastaba Production Bot"
          git config user.email "actions@users.noreply.github.com"
          git add $FILES
          git commit -m "Fix score input jump and duplicate prediction edits"
          git push
